<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="MyCartao">
  <!-- Presence Loop: dois cartões + abertura de avatar -->
  <rect width="32" height="32" rx="8" fill="#0f766e"/>
  <!-- Cartão de fundo (baixo-esquerda) -->
  <rect x="5.2" y="10.4" width="15.2" height="11.6" rx="2.4" fill="#faf8f5"/>
  <!-- Cartão da frente (cima-direita) -->
  <rect x="11.6" y="8" width="15.2" height="11.6" rx="2.4" fill="#faf8f5"/>
  <!-- Abertura / lente de presença -->
  <circle cx="16" cy="15.2" r="4.55" fill="#0f766e"/>
</svg>
